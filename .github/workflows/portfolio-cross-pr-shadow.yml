name: Portfolio Shadow CI - Cross-PR Coordination

# Personal-fork portfolio evidence only. This workflow validates the detector
# and its frozen historical evidence without writing to PR or repository state.
on:
  push:
    branches:
      - dx/cross-pr-coordination-guard
    paths:
      - .github/fixtures/cross-pr-coordination-history.json
      - .github/scripts/cross_pr_coordination_guard.README.md
      - .github/scripts/cross_pr_coordination_guard.py
      - .github/workflows/portfolio-cross-pr-shadow.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-cross-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify cross-PR coordination detector
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Replay development and frozen holdout evidence
        run: python3 .github/scripts/cross_pr_coordination_guard.py --self-check
